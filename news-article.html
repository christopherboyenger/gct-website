<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCT Daily</title>
  <meta name="description" content="GCT Daily — intelligence for the golf creator economy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/appfavicon.jpg">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f1524;--bg2:#131c30;--gold:#c9982a;--gold2:#e8b84b;--white:#fff;--muted:#8a9ab5;--line:rgba(255,255,255,.08);--light:#f6f3ec;--ink:#141b2d}body{background:var(--bg);color:#fff;font-family:Inter,sans-serif}.shell{max-width:1120px;margin:0 auto;padding:0 28px}.topbar{border-bottom:1px solid var(--line);background:rgba(9,13,23,.94);position:sticky;top:0;z-index:40;backdrop-filter:blur(18px)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}.brand img{height:38px}.brand b{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.nav a:last-child{color:var(--gold2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}.hero{padding:86px 0 56px;background:radial-gradient(circle at 80% 0,rgba(201,152,42,.14),transparent 35%)}.tag{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin-bottom:18px}.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(54px,8vw,92px);line-height:.94;max-width:900px}.dek{font-size:19px;line-height:1.7;color:rgba(255,255,255,.62);max-width:820px;margin-top:22px}.meta{margin-top:28px;display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.heroimg{width:100%;height:min(56vw,590px);object-fit:cover;border-radius:24px;margin:22px 0 0;border:1px solid var(--line)}.article-wrap{background:var(--light);color:var(--ink);padding:72px 0 90px}.article{max-width:800px;margin:0 auto}.brief{display:grid;gap:12px;margin-bottom:42px}.brief-card{border:1px solid rgba(20,27,45,.1);background:#fff;border-radius:16px;padding:24px}.brief-card b{display:block;color:#a87d1e;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}.brief-card p{color:#4f596c;font-size:15px;line-height:1.72}.story p{font-size:18px;line-height:1.9;color:#364054;margin-bottom:24px}.source{margin-top:44px;padding-top:24px;border-top:1px solid rgba(20,27,45,.12);font-size:12px;color:#687184}.source a{color:#9c7218;font-weight:700}.back{display:inline-block;margin-top:34px;color:#9c7218;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-decoration:none}.error{padding:110px 0;text-align:center}.error h1{font-family:'Bebas Neue';font-size:64px}.error a{color:var(--gold2)}footer{padding:35px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    @media(max-width:620px){.shell{padding:0 18px}.hero{padding-top:58px}.article-wrap{padding-top:45px}.story p{font-size:17px}.brand b{display:none}}
  </style>
</head>
<body>
<header class="topbar"><div class="shell nav"><a class="brand" href="/news"><img src="/logo-gct-icon.png.png" alt="Golf Creator Tour"><b>GCT Daily</b></a><a href="/news">← Newsroom</a></div></header>
<div id="page"><section class="error"><div class="shell"><h1>Loading story…</h1></div></section></div>
<footer><div class="shell">© 2026 Golf Creator Tour · GCT Daily</div></footer>
<script>
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const formatDate=value=>new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z'));
  const params=new URLSearchParams(location.search); const slug=params.get('slug')||location.pathname.split('/').filter(Boolean).pop();
  fetch('/news-data.json').then(r=>r.json()).then(data=>{
    const s=(data.stories||[]).find(x=>x.slug===slug);
    if(!s)throw new Error('not found');
    document.title=s.title+' — GCT Daily';
    document.querySelector('meta[name="description"]').setAttribute('content',s.dek||'GCT Daily');
    const body=(s.body||[]).map(p=>`<p>${esc(p)}</p>`).join('');
    document.getElementById('page').innerHTML=`
      <section class="hero"><div class="shell"><div class="tag">${esc(s.category)}${s.kicker?' · '+esc(s.kicker):''}</div><h1>${esc(s.title)}</h1><p class="dek">${esc(s.dek)}</p><div class="meta"><span>${formatDate(s.date)}</span><span>${esc(s.readTime)}</span><span>${esc(s.sourceName)}</span></div>${s.image?`<img class="heroimg" src="/${encodeURI(s.image)}" alt="${esc(s.title)}">`:''}</div></section>
      <section class="article-wrap"><div class="shell"><article class="article">
        <div class="brief"><div class="brief-card"><b>What happened</b><p>${esc(s.whatHappened)}</p></div><div class="brief-card"><b>Why it matters</b><p>${esc(s.whyItMatters)}</p></div><div class="brief-card"><b>The GCT take</b><p>${esc(s.gctTake)}</p></div></div>
        <div class="story">${body}</div>
        <div class="source">Source: ${s.sourceUrl?`<a href="${esc(s.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(s.sourceName)}</a>`:esc(s.sourceName)}</div>
        <a class="back" href="/news">← Back to GCT Daily</a>
      </article></div></section>`;
  }).catch(()=>{document.getElementById('page').innerHTML='<section class="error"><div class="shell"><h1>Story not found</h1><p><a href="/news">Return to GCT Daily</a></p></div></section>'});
</script>
</body>
</html>
