<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Creator app showing points, streak and leaderboard">
  <defs>
    <linearGradient id="cvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12294b"/>
      <stop offset="1" stop-color="#0b1d38"/>
    </linearGradient>
    <linearGradient id="cvGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#e8cf8e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" rx="18" fill="url(#cvBg)"/>
  <rect x="0.5" y="0.5" width="639" height="419" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- phone -->
  <g>
    <rect x="228" y="34" width="184" height="376" rx="26" fill="#0a1930"/>
    <rect x="230.5" y="36.5" width="179" height="371" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    <rect x="290" y="46" width="60" height="8" rx="4" fill="#050d1b"/>

    <!-- points header -->
    <text x="320" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#e8cf8e">2,470</text>
    <text x="320" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#ffffff" opacity="0.55">TOUR POINTS</text>

    <!-- streak chip -->
    <rect x="252" y="152" width="136" height="30" rx="15" fill="#ffffff" opacity="0.07"/>
    <path d="M270 176c-4-2-6-5.5-6-9 0-4.5 3.2-7 3.2-7s-.4 2.8 1.6 4c0-5 3.4-8 6.2-9-1 3-.6 5.4.8 7.2 1.4 1.8 2.6 3.2 2.6 5.6 0 3.4-2.2 6.6-5.6 8.2z" fill="#e8cf8e"/>
    <text x="286" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">12-week streak</text>

    <!-- leaderboard -->
    <rect x="252" y="198" width="98" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
    <g>
      <rect x="252" y="216" width="136" height="34" rx="9" fill="url(#cvGold)"/>
      <text x="264" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#10233f">1</text>
      <circle cx="284" cy="233" r="9" fill="#10233f" opacity="0.85"/>
      <rect x="300" y="229" width="64" height="8" rx="4" fill="#10233f" opacity="0.8"/>
    </g>
    <g>
      <rect x="252" y="256" width="136" height="34" rx="9" fill="#ffffff" opacity="0.07"/>
      <text x="264" y="278" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" opacity="0.8">2</text>
      <circle cx="284" cy="273" r="9" fill="#9fc0e8"/>
      <rect x="300" y="269" width="56" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
    </g>
    <g>
      <rect x="252" y="296" width="136" height="34" rx="9" fill="#ffffff" opacity="0.07"/>
      <text x="264" y="318" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" opacity="0.8">3</text>
      <circle cx="284" cy="313" r="9" fill="#d9d4c8"/>
      <rect x="300" y="309" width="60" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- nav bar -->
    <rect x="252" y="352" width="136" height="34" rx="12" fill="#ffffff" opacity="0.06"/>
    <circle cx="278" cy="369" r="5" fill="#e8cf8e"/>
    <circle cx="320" cy="369" r="5" fill="#ffffff" opacity="0.3"/>
    <circle cx="362" cy="369" r="5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- floating chips: left -->
  <g>
    <rect x="44" y="96" width="156" height="52" rx="14" fill="#ffffff" opacity="0.08"/>
    <circle cx="70" cy="122" r="13" fill="#3fae6a"/>
    <path d="m64 122 4.5 4.5 8-9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="110" width="92" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="92" y="126" width="66" height="7" rx="3.5" fill="#ffffff" opacity="0.3"/>
  </g>
  <g>
    <rect x="44" y="252" width="156" height="52" rx="14" fill="#ffffff" opacity="0.08"/>
    <text x="70" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#e8cf8e">$</text>
    <rect x="92" y="266" width="86" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="92" y="282" width="58" height="7" rx="3.5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- floating chips: right -->
  <g>
    <rect x="440" y="128" width="156" height="52" rx="14" fill="#ffffff" opacity="0.08"/>
    <path d="M466 116 l4.2 8.6 9.4 1.3 -6.8 6.6 1.6 9.3 -8.4-4.4 -8.4 4.4 1.6-9.3 -6.8-6.6 9.4-1.3z" transform="translate(0,26)" fill="#e8cf8e"/>
    <rect x="488" y="142" width="92" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="488" y="158" width="60" height="7" rx="3.5" fill="#ffffff" opacity="0.3"/>
  </g>
  <g>
    <rect x="440" y="284" width="156" height="52" rx="14" fill="#ffffff" opacity="0.08"/>
    <path d="M456 322 l10-12 8 7 12-16 8 6" fill="none" stroke="#e8cf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="504" y="298" width="76" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="504" y="314" width="52" height="7" rx="3.5" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
