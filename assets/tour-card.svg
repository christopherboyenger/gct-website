<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="Gold metal Golf Creator Tour member card — front">
  <defs>
    <linearGradient id="tcBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#c19a45"/>
      <stop offset="0.32" stop-color="#d9b862"/>
      <stop offset="0.55" stop-color="#e9d084"/>
      <stop offset="0.78" stop-color="#d3af58"/>
      <stop offset="1"    stop-color="#b8913f"/>
    </linearGradient>
    <linearGradient id="tcSweep" x1="0" y1="0" x2="1" y2="0.65">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#fff7dd" stop-opacity="0.28"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tcEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2ac"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
    <pattern id="tcBrush" width="6" height="540" patternUnits="userSpaceOnUse">
      <rect width="6" height="540" fill="none"/>
      <line x1="1.5" y1="0" x2="1.5" y2="540" stroke="#8a6a2a" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="4.5" y1="0" x2="4.5" y2="540" stroke="#fff6d8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <clipPath id="tcClip"><rect x="6" y="6" width="844" height="528" rx="34"/></clipPath>
  </defs>

  <rect width="856" height="540" rx="40" fill="url(#tcEdge)"/>
  <g clip-path="url(#tcClip)">
    <rect x="6" y="6" width="844" height="528" fill="url(#tcBase)"/>
    <rect x="6" y="6" width="844" height="528" fill="url(#tcBrush)"/>
    <rect x="6" y="6" width="844" height="528" fill="url(#tcSweep)"/>
  </g>

  <!-- wordmark -->
  <text x="428" y="92" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="14" fill="#1c1608">GOLF CREATOR TOUR</text>

  <!-- laurel + golf ball on tee -->
  <g transform="translate(428 235)">
    <!-- laurel left -->
    <g fill="#1c1608">
      <g transform="translate(-118 -44) rotate(-58)"><ellipse rx="9" ry="22"/></g>
      <g transform="translate(-128 -12) rotate(-72)"><ellipse rx="9" ry="23"/></g>
      <g transform="translate(-131 22) rotate(-86)"><ellipse rx="9" ry="24"/></g>
      <g transform="translate(-126 56) rotate(-100)"><ellipse rx="9" ry="24"/></g>
      <g transform="translate(-113 86) rotate(-116)"><ellipse rx="9" ry="23"/></g>
      <g transform="translate(-84 -46) rotate(-30)"><ellipse rx="8" ry="20"/></g>
      <g transform="translate(-96 -14) rotate(-44)"><ellipse rx="8" ry="21"/></g>
      <g transform="translate(-100 20) rotate(-58)"><ellipse rx="8" ry="22"/></g>
      <g transform="translate(-95 54) rotate(-74)"><ellipse rx="8" ry="22"/></g>
      <g transform="translate(-82 84) rotate(-90)"><ellipse rx="8" ry="21"/></g>
    </g>
    <!-- laurel right (mirror) -->
    <g fill="#1c1608" transform="scale(-1 1)">
      <g transform="translate(-118 -44) rotate(-58)"><ellipse rx="9" ry="22"/></g>
      <g transform="translate(-128 -12) rotate(-72)"><ellipse rx="9" ry="23"/></g>
      <g transform="translate(-131 22) rotate(-86)"><ellipse rx="9" ry="24"/></g>
      <g transform="translate(-126 56) rotate(-100)"><ellipse rx="9" ry="24"/></g>
      <g transform="translate(-113 86) rotate(-116)"><ellipse rx="9" ry="23"/></g>
      <g transform="translate(-84 -46) rotate(-30)"><ellipse rx="8" ry="20"/></g>
      <g transform="translate(-96 -14) rotate(-44)"><ellipse rx="8" ry="21"/></g>
      <g transform="translate(-100 20) rotate(-58)"><ellipse rx="8" ry="22"/></g>
      <g transform="translate(-95 54) rotate(-74)"><ellipse rx="8" ry="22"/></g>
      <g transform="translate(-82 84) rotate(-90)"><ellipse rx="8" ry="21"/></g>
    </g>

    <!-- ball -->
    <circle cx="0" cy="-18" r="52" fill="#1c1608"/>
    <g fill="#e9d084">
      <circle cx="-22" cy="-38" r="3.4"/><circle cx="-4" cy="-42" r="3.4"/><circle cx="14" cy="-38" r="3.4"/>
      <circle cx="-30" cy="-22" r="3.4"/><circle cx="-12" cy="-26" r="3.4"/><circle cx="6" cy="-26" r="3.4"/><circle cx="24" cy="-22" r="3.4"/>
      <circle cx="-34" cy="-6" r="3.4"/><circle cx="-16" cy="-10" r="3.4"/><circle cx="2" cy="-10" r="3.4"/><circle cx="20" cy="-6" r="3.4"/><circle cx="34" cy="-10" r="3.4"/>
      <circle cx="-26" cy="10" r="3.4"/><circle cx="-8" cy="6" r="3.4"/><circle cx="10" cy="6" r="3.4"/><circle cx="28" cy="10" r="3.4"/>
    </g>
    <!-- tee -->
    <path d="M-30 40 L30 40 L14 62 L14 108 L-14 108 L-14 62 Z" fill="#1c1608"/>
  </g>

  <!-- member line -->
  <text x="428" y="452" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="18" fill="#1c1608">TOUR MEMBER</text>
</svg>
