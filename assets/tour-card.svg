<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="Gold metal Golf Creator Tour membership card">
  <defs>
    <linearGradient id="tcGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#8a6a2a"/>
      <stop offset="0.25" stop-color="#c9a24b"/>
      <stop offset="0.5"  stop-color="#eed99a"/>
      <stop offset="0.75" stop-color="#c9a24b"/>
      <stop offset="1"    stop-color="#7d5f24"/>
    </linearGradient>
    <linearGradient id="tcSheen" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tcEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7b6"/>
      <stop offset="1" stop-color="#6d531f"/>
    </linearGradient>
  </defs>

  <rect width="856" height="540" rx="36" fill="url(#tcEdge)"/>
  <rect x="6" y="6" width="844" height="528" rx="30" fill="url(#tcGold)"/>
  <rect x="6" y="6" width="844" height="528" rx="30" fill="url(#tcSheen)"/>

  <!-- brushed metal lines -->
  <g stroke="#6d531f" stroke-opacity="0.10">
    <line x1="6" y1="86"  x2="850" y2="86"/>
    <line x1="6" y1="156" x2="850" y2="156"/>
    <line x1="6" y1="226" x2="850" y2="226"/>
    <line x1="6" y1="296" x2="850" y2="296"/>
    <line x1="6" y1="366" x2="850" y2="366"/>
    <line x1="6" y1="436" x2="850" y2="436"/>
  </g>

  <!-- crest: ball on tee in laurel -->
  <g transform="translate(80,64)" fill="#3d2f10">
    <circle cx="60" cy="46" r="26" fill="none" stroke="#3d2f10" stroke-width="5"/>
    <g fill="#3d2f10">
      <circle cx="52" cy="38" r="2.6"/><circle cx="62" cy="36" r="2.6"/><circle cx="70" cy="42" r="2.6"/>
      <circle cx="54" cy="48" r="2.6"/><circle cx="64" cy="47" r="2.6"/><circle cx="58" cy="57" r="2.6"/>
    </g>
    <path d="M50 76h20l-7 14v18h-6V90z"/>
    <path d="M18 52c-6 14-2 34 12 46l4-5C23 83 20 66 24 55zM102 52c6 14 2 34-12 46l-4-5c11-10 14-27 10-38z" opacity="0.9"/>
  </g>

  <text x="776" y="96" text-anchor="end" font-family="Georgia, serif" font-size="30" letter-spacing="6" fill="#3d2f10" font-weight="700">TOUR MEMBER</text>
  <text x="776" y="130" text-anchor="end" font-family="Georgia, serif" font-size="17" letter-spacing="4" fill="#5c4718">SEASON 2026</text>

  <text x="80" y="286" font-family="Georgia, serif" font-size="44" letter-spacing="3" fill="#2e2408" font-weight="700">THE GOLF CREATOR TOUR</text>
  <rect x="80" y="308" width="330" height="4" rx="2" fill="#3d2f10" opacity="0.55"/>

  <!-- member name / number: edit these -->
  <text x="80" y="416" font-family="Georgia, serif" font-size="38" letter-spacing="5" fill="#3d2f10" font-weight="700">JORDAN WELLS</text>
  <text x="80" y="466" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#5c4718">MEMBER Nº 042</text>

  <text x="776" y="466" text-anchor="end" font-family="Georgia, serif" font-size="19" letter-spacing="4" fill="#5c4718">EST. 2025</text>
</svg>
