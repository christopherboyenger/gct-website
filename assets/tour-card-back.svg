<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" role="img" aria-label="Gold metal Golf Creator Tour member card — back, 2026 season, member number GCT-2026-0001">
  <defs>
    <linearGradient id="tbBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#c19a45"/>
      <stop offset="0.32" stop-color="#d9b862"/>
      <stop offset="0.55" stop-color="#e9d084"/>
      <stop offset="0.78" stop-color="#d3af58"/>
      <stop offset="1"    stop-color="#b8913f"/>
    </linearGradient>
    <linearGradient id="tbSweep" x1="0" y1="0" x2="1" y2="0.65">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#fff7dd" stop-opacity="0.28"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tbEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2ac"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
    <pattern id="tbBrush" width="6" height="540" patternUnits="userSpaceOnUse">
      <rect width="6" height="540" fill="none"/>
      <line x1="1.5" y1="0" x2="1.5" y2="540" stroke="#8a6a2a" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="4.5" y1="0" x2="4.5" y2="540" stroke="#fff6d8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <clipPath id="tbClip"><rect x="6" y="6" width="844" height="528" rx="34"/></clipPath>
  </defs>

  <rect width="856" height="540" rx="40" fill="url(#tbEdge)"/>
  <g clip-path="url(#tbClip)">
    <rect x="6" y="6" width="844" height="528" fill="url(#tbBase)"/>
    <rect x="6" y="6" width="844" height="528" fill="url(#tbBrush)"/>
    <rect x="6" y="6" width="844" height="528" fill="url(#tbSweep)"/>

    <!-- watermark: ball on tee with half laurel, bottom-right -->
    <g transform="translate(700 400)" opacity="0.18">
      <circle cx="0" cy="-30" r="78" fill="#8a6a2a"/>
      <g fill="#d9b862">
        <circle cx="-33" cy="-60" r="5"/><circle cx="-6" cy="-66" r="5"/><circle cx="21" cy="-60" r="5"/>
        <circle cx="-45" cy="-36" r="5"/><circle cx="-18" cy="-42" r="5"/><circle cx="9" cy="-42" r="5"/><circle cx="36" cy="-36" r="5"/>
        <circle cx="-51" cy="-12" r="5"/><circle cx="-24" cy="-18" r="5"/><circle cx="3" cy="-18" r="5"/><circle cx="30" cy="-12" r="5"/><circle cx="51" cy="-18" r="5"/>
        <circle cx="-39" cy="12" r="5"/><circle cx="-12" cy="6" r="5"/><circle cx="15" cy="6" r="5"/><circle cx="42" cy="12" r="5"/>
      </g>
      <path d="M-45 56 L45 56 L21 88 L21 156 L-21 156 L-21 88 Z" fill="#8a6a2a"/>
      <g fill="#8a6a2a">
        <g transform="translate(-124 -66) rotate(-58)"><ellipse rx="13" ry="32"/></g>
        <g transform="translate(-138 -18) rotate(-72)"><ellipse rx="13" ry="34"/></g>
        <g transform="translate(-142 32) rotate(-86)"><ellipse rx="13" ry="35"/></g>
        <g transform="translate(-136 82) rotate(-100)"><ellipse rx="13" ry="35"/></g>
        <g transform="translate(-118 126) rotate(-116)"><ellipse rx="13" ry="34"/></g>
      </g>
    </g>
  </g>

  <!-- header line -->
  <text x="88" y="112" font-family="Manrope, 'Segoe UI', Arial, sans-serif"
        font-size="27" font-weight="700" letter-spacing="11" fill="#1c1608">TOUR MEMBER &#183; 2026 SEASON</text>

  <!-- member number -->
  <text x="88" y="468" font-family="Manrope, 'Segoe UI', Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="10" fill="#1c1608">GCT-2026-0001</text>
</svg>
