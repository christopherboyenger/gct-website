  <rect x="28" y="50" width="130" height="9" rx="4.5" fill="#ffffff" opacity="0.30"/>
  <rect x="472" y="28" width="140" height="34" rx="17" fill="#c9a24b"/>
  <rect x="496" y="42" width="92" height="7" rx="3.5" fill="#10233f"/>

