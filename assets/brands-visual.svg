  </defs>

  <rect width="640" height="420" rx="18" fill="url(#bvBg)"/>
  <rect x="0.5" y="0.5" width="639" height="419" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- header -->
